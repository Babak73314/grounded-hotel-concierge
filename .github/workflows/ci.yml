name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Two operating systems on purpose: the availability hash, the time
        # zone and the bilingual text must come out identical on both.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore GroundedConcierge.sln --locked-mode

      - name: Build
        run: dotnet build GroundedConcierge.sln -c Release --no-restore

      - name: Test
        run: dotnet test GroundedConcierge.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Run the demo
        run: dotnet run --project samples/GroundedConcierge.Demo -c Release --no-build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
